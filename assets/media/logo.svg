<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mandoub Tawseel">
  <defs>
    <linearGradient id="mt-badge" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#mt-badge)"/>
  <!-- M monogram: one continuous 6px stroke, round caps. Reads at 20px. -->
  <path d="M16 46V22l16 16 16-16v24"
        fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Motion tick: direction-neutral, identical in RTL and LTR -->
  <path d="M10 52h12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
