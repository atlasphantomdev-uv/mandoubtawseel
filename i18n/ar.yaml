# Arabic (ar-ae) UI string overrides.
# The theme ships i18n/ar.yaml with 79 keys but 10 of them are still English —
# translated here. Project i18n takes precedence over the module for same keys.
# Source of the leak list: blox module i18n/ar.yaml.

- id: home
  translation: الرئيسية

- id: close
  translation: إغلاق

# Screen-reader name for the mobile menu checkbox (navbar.html). The visible
# hamburger glyph has no text of its own.
- id: nav_menu
  translation: القائمة

# Home-screen label for the PWA manifest (layouts/_default/webappmanifest.json).
- id: site_short_name
  translation: مندوب توصيل

- id: languages
  translation: اللغات

- id: theme_selector
  translation: تفضيلات العرض

- id: btn_copied
  translation: تم النسخ

- id: contact_attachment
  translation: إرفاق ملف

- id: slides
  translation: الشرائح

- id: authors
  translation: الكتّاب

- id: search_common_queries
  translation: عمليات بحث شائعة

- id: published_with
  translation: صُنع بواسطة {hugoblox}

