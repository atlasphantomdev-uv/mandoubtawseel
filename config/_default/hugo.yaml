# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
baseURL: 'https://atlasphantomdev-uv.github.io/mandoubtawseel/' # GitHub Pages (CI overrides via configure-pages)

############################
## PAGE OPTIONS
############################

# No cascade rules: the starter's `/docs/**` and `/blog/**` cascades referenced the
# demo content that was removed. The Arabic blog under /مدونة/** sets its own front
# matter. Add per-section cascades here again only when a section needs shared defaults.

############################
## LANGUAGE
############################

defaultContentLanguage: ar
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
# MUST stay false: removePathAccents applies Unicode NFKD and strips the hamza
# combining mark, silently rewriting Arabic filenames — وظائف -> وظايف (a misspelling),
# أسعار -> اسعار. That desynchronises authored slugs, menus and internal links.
# With it false the slug is exactly what the author wrote.
removePathAccents: false

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
enableInlineShortcodes: true
# GitHub Pages cannot do server-side redirects, and disableAliases:true would drop
# even the meta-refresh alias pages — which are the only way to serve the hamza
# spelling variants (أبوظبي vs ابوظبي) on Pages. Must stay false.
disableAliases: false
outputs:
  home: [HTML, RSS, WebAppManifest, headers, redirects, backlinks, LLM]
  page: [HTML]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  jpeg:
    quality: 90
  webp:
    quality: 90
    hint: picture
  anchor: smart
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  author: authors

# No content uses tags/categories/authors, so the taxonomy LIST pages were being
# generated empty — three indexable thin pages (/tags/, /categories/, /authors/),
# one of which was in the sitemap. Disable the list kind; the taxonomies stay declared
# so theme partials that look them up keep working.
disableKinds:
  - taxonomy
markup:
  _merge: deep
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
security:
  _merge: deep
  exec:
    # Replaces the module's list (slices are not deep-merged) — keep all + tailwindcss
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
sitemap:
  _merge: deep
minify:
  _merge: deep
